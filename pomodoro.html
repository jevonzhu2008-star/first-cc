<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="main-card" id="mainCard">
    <div class="brand-mark">
      <div class="dot" id="brandDot"></div>
      <span>专注计时</span>
    </div>

    <div class="tabs">
      <button class="tab active" data-mode="work"><span>工作</span></button>
      <button class="tab" data-mode="shortBreak"><span>短休息</span></button>
      <button class="tab" data-mode="longBreak"><span>长休息</span></button>
    </div>

    <div class="task-section">
      <input type="text" class="task-input" id="taskInput" placeholder="输入当前任务..." autocomplete="off">
    </div>

    <div class="timer-display">
      <div class="timer-ring">
        <svg viewBox="0 0 220 220">
          <circle class="bg" cx="110" cy="110" r="100"/>
          <circle class="bar" cx="110" cy="110" r="100" stroke-dasharray="628.32" stroke-dashoffset="0"/>
        </svg>
        <div class="timer-text" id="timer">
          25:00
          <span class="label" id="timerLabel">准备开始</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="btnToggle">开始</button>
      <button class="btn btn-secondary" id="btnReset">重置</button>
      <button class="btn btn-secondary" id="btnSkip">跳过</button>
      <button class="btn btn-icon" id="btnSound" title="白噪音">&#127926;</button>
      <button class="btn btn-icon" id="btnTasks" title="任务清单">&#128198;</button>
      <button class="btn btn-icon" id="btnSettings" title="设置">&#9881;</button>
    </div>

    <div class="stats-bar" id="statsBar">
      <div class="stat-chip">
        <span>今日</span>
        <span class="value" id="count">0</span>
      </div>
      <div class="stat-chip">
        <span>专注</span>
        <span class="value" id="totalTime">0m</span>
      </div>
      <div class="stat-chip">
        <span>本周</span>
        <span class="value" id="weekCount">0</span>
      </div>
    </div>
  </div>

  <div class="panel" id="settingsPanel">
    <div class="panel-title">设置</div>
    <div class="setting-row">
      <span class="setting-label">工作 (分钟)</span>
      <input type="number" class="setting-input" id="workMin" value="25" min="1" max="120">
    </div>
    <div class="setting-row">
      <span class="setting-label">短休息 (分钟)</span>
      <input type="number" class="setting-input" id="shortBreakMin" value="5" min="1" max="60">
    </div>
    <div class="setting-row">
      <span class="setting-label">长休息 (分钟)</span>
      <input type="number" class="setting-input" id="longBreakMin" value="15" min="1" max="120">
    </div>
    <div class="setting-row">
      <span class="setting-label">自动开始休息</span>
      <div class="toggle-switch on" id="toggleAutoBreak"></div>
    </div>
    <div class="setting-row">
      <span class="setting-label">自动开始工作</span>
      <div class="toggle-switch" id="toggleAutoWork"></div>
    </div>
    <div class="export-row">
      <button class="btn btn-secondary" id="btnExportJson">导出 JSON</button>
      <button class="btn btn-secondary" id="btnExportCsv">导出 CSV</button>
      <button class="btn btn-secondary" id="btnClear">清空数据</button>
    </div>
  </div>

  <div class="panel" id="historyPanel">
    <div class="panel-title">今日记录</div>
    <div class="history-list" id="historyList">
      <div class="history-empty">暂无记录</div>
    </div>
  </div>

  <div class="panel" id="tasksPanel">
    <div class="panel-title">任务清单</div>
    <div class="task-add-row">
      <input type="text" class="task-add-input" id="taskAddInput" placeholder="输入新任务..." autocomplete="off">
      <button class="btn btn-primary btn-sm" id="btnAddTask">添加</button>
    </div>
    <div class="task-list" id="taskList">
      <div class="task-empty">暂无任务</div>
    </div>
  </div>

  <div class="shortcuts-hint">
    <kbd>空格</kbd> 开始/暂停 &nbsp; <kbd>S</kbd> 跳过 &nbsp; <kbd>R</kbd> 重置 &nbsp; <kbd>H</kbd> 记录
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
